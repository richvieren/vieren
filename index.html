<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vieren</title>
<style>
@font-face {
  font-family: 'Podium';
  src: url('fonts/podium-sharp.otf') format('opentype');
  font-weight: 900;
  font-display: swap;
}
@font-face {
  font-family: 'Gira Sans';
  src: url('fonts/gira-sans-book.otf') format('opentype');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Gira Sans';
  src: url('fonts/gira-sans-bold.otf') format('opentype');
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: 'Gira Sans';
  src: url('fonts/gira-sans-book-italic.otf') format('opentype');
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}

:root {
  --bg: #0a0a0a;
  --t1: #FFFFFF;
  --t2: #D0C1B7;
  --t3: #777;
  --ac: #F8354A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--t2);
  font-family: 'Gira Sans', sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

.hero-title {
  font-family: 'Podium', sans-serif;
  font-weight: 900;
  font-size: clamp(48px, 10vw, 140px);
  color: var(--t1);
  text-transform: uppercase;
  letter-spacing: -.02em;
  line-height: .88;
  margin-bottom: 24px;
}

.hero-sub {
  font-size: 14px;
  color: var(--t3);
  letter-spacing: .2em;
  text-transform: uppercase;
  margin-bottom: 60px;
}

.projects {
  display: flex;
  gap: 32px;
  flex-wrap: wrap;
  justify-content: center;
}

.project-link {
  padding: 14px 32px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 100px;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .1em;
  color: var(--t2);
  transition: all .3s;
}
.project-link:hover {
  border-color: var(--ac);
  color: var(--t1);
}

.bottom {
  position: absolute;
  bottom: 40px;
  font-size: 11px;
  color: var(--t3);
  letter-spacing: .15em;
  text-transform: uppercase;
}

@media (max-width: 600px) {
  .projects { flex-direction: column; align-items: center; gap: 16px; }
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-title">Vieren</div>
  <div class="hero-sub">Richard van der Veren</div>
  <div class="projects">
    <a href="https://lore.video" class="project-link" target="_blank">Lore.video</a>
    <a href="https://countingsheep.club" class="project-link" target="_blank">Counting Sheep Club</a>
    <a href="https://wolfchildren.co" class="project-link" target="_blank">Wolf Children</a>
    <a href="#" class="project-link">Apex OS</a>
  </div>
  <div class="bottom">2026</div>
</div>

</body>
</html>
