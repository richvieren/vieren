<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Podium';
  src: url('fonts/podium-sharp.otf') format('opentype');
  font-weight: 900;
  font-display: swap;
}
@font-face {
  font-family: 'Dharma Gothic';
  src: url('fonts/dharma-gothic-heavy.ttf') format('truetype');
  font-weight: 800;
  font-display: swap;
}

:root {
  --bg: #0a0a0a;
  --t1: #EEE8D8;
  --t3: #9a9a8a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--t1);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

/* ══ NAV ══ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 99;
  padding: 20px 40px;
  display: flex; align-items: center; justify-content: space-between;
  mix-blend-mode: difference;
}
.nav-left { display: flex; align-items: baseline; gap: 12px; }
.nav-logo {
  font-family: 'Podium', sans-serif; font-weight: 900;
  font-size: 20px; color: #fff; letter-spacing: .02em; text-transform: uppercase;
}
.nav-title {
  font-family: 'Dharma Gothic', sans-serif; font-weight: 800;
  font-size: 22px; color: #fff; letter-spacing: .02em; text-transform: uppercase;
  line-height: 1;
}
.nav-right { display: flex; align-items: center; }
.nav-right a {
  font-family: 'Jost', sans-serif;
  font-size: 13px; font-weight: 300; letter-spacing: .06em;
  color: #fff; transition: opacity .3s;
}
.nav-right a:hover { opacity: 0.5; }
.nav-comma { font-size: 13px; color: rgba(255,255,255,0.4); margin: 0 8px; }

/* ══ GRID ══ */
.sf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
  padding: 90px 40px 60px;
}
.sf-item {
  all: unset; cursor: pointer;
  position: relative; display: block;
  aspect-ratio: 9/16; overflow: hidden;
  background: #161616;
}
.sf-item:focus-visible { outline: 2px solid var(--t1); outline-offset: 3px; }
.sf-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .3s; }
.sf-item:hover img { opacity: .8; }
.sf-item iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

@media (max-width: 600px) {
  nav { padding: 16px 20px; }
  .sf-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 70px 6px 40px; }
}
</style>
</head>
<body>

<script>
// Click a thumbnail to play it in place; only one plays at a time
(function() {
  var grid = document.getElementById('sfGrid');
  var current = null;
  grid.addEventListener('click', function(e) {
    var item = e.target.closest('.sf-item');
    if (!item || item === current) return;
    if (current) {
      current.querySelector('iframe').remove();
      current.querySelector('img').style.display = '';
    }
    var f = document.createElement('iframe');
    f.src = 'https://player.vimeo.com/video/' + item.dataset.vid + '?autoplay=1&title=0&byline=0&portrait=0&color=FF9F00';
    f.allow = 'autoplay; fullscreen; picture-in-picture';
    item.querySelector('img').style.display = 'none';
    item.appendChild(f);
    current = item;
  });
})();
</script>
