<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Diary — Vieren</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Podium';
  src: url('fonts/podium-sharp.otf') format('opentype');
  font-weight: 900;
  font-display: swap;
}
@font-face {
  font-family: 'Dharma Gothic';
  src: url('fonts/dharma-gothic-heavy.ttf') format('truetype');
  font-weight: 800;
  font-display: swap;
}

:root {
  --bg: #0a0a0a;
  --t1: #EEE8D8;
  --t3: #9a9a8a;
  --t4: #6a6a5a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--t1);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

/* ══ NAV ══ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 99;
  padding: 20px 40px;
  display: flex; align-items: center; justify-content: space-between;
  mix-blend-mode: difference;
}
.nav-left {
  display: flex; align-items: baseline; gap: 12px;
}
.nav-logo {
  font-family: 'Podium', sans-serif; font-weight: 900;
  font-size: 20px; color: #fff; letter-spacing: .02em; text-transform: uppercase;
}
.nav-title {
  font-family: 'Dharma Gothic', sans-serif; font-weight: 800;
  font-size: 22px; color: #fff; letter-spacing: .02em; text-transform: uppercase;
  line-height: 1;
}
.nav-mid {
  display: flex; align-items: center; gap: 0;
}
.zoom-btn {
  font-family: 'Jost', sans-serif;
  font-size: 16px; font-weight: 300;
  color: #fff; background: none; border: none;
  cursor: pointer; line-height: 1;
  padding: 0 2px;
  transition: opacity .3s;
}
.zoom-btn:hover { opacity: 0.5; }
.zoom-sep {
  font-size: 13px; color: rgba(255,255,255,0.4);
  font-weight: 300;
  margin: 0 1px;
}
.nav-right {
  display: flex; align-items: center; gap: 0;
}
.nav-right a, .nav-right button {
  font-family: 'Jost', sans-serif;
  font-size: 13px; font-weight: 300;
  letter-spacing: .06em;
  color: #fff; background: none; border: none; cursor: pointer;
  transition: opacity .3s;
}
.nav-right a:hover, .nav-right button:hover { opacity: 0.5; }
.nav-comma {
  font-size: 13px; color: rgba(255,255,255,0.4);
  margin: 0 8px;
  font-weight: 300;
}

/* ══ FIXED DATE ══ */
.diary-date {
  position: fixed;
  top: 50%;
  left: 40px;
  transform: translateY(-50%);
  z-index: 50;
  font-family: 'Jost', sans-serif;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: .06em;
  color: rgba(255,255,255,0.7);
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  mix-blend-mode: difference;
  pointer-events: none;
  transition: opacity .4s;
}

/* ══ DIARY ENTRIES ══ */
.diary-feed {
  width: 100%;
  transition: max-width .4s ease, padding .4s ease;
}
.diary-entry {
  position: relative;
  width: 100%;
}
.diary-entry img {
  width: 100%;
  display: block;
}

/* Zoom levels */
body.zoom-1 .diary-feed { max-width: 100%; margin: 0; }
body.zoom-1 .diary-entry { margin-bottom: 0; }

body.zoom-2 .diary-feed { max-width: 55%; margin: 0 0 0 auto; padding-right: 10%; }
body.zoom-2 .diary-entry { margin-bottom: 12px; }

body.zoom-3 .diary-feed { max-width: 10%; margin: 0 0 0 auto; padding-right: 10%; }
body.zoom-3 .diary-entry { margin-bottom: 16px; }

/* ══ ARCHIVE OVERLAY ══ */
.archive-dropdown {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 100;
  background: rgba(10,10,10,0.95);
  display: none; align-items: center; justify-content: center;
}
.archive-dropdown.open { display: flex; }
.archive-inner {
  text-align: center;
  max-height: 70vh;
  overflow-y: auto;
}
.archive-year {
  font-family: 'Podium', sans-serif; font-weight: 900;
  font-size: 32px; letter-spacing: .1em;
  color: var(--t1);
  margin-bottom: 16px;
  margin-top: 32px;
}
.archive-year:first-child { margin-top: 0; }
.archive-months {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px;
  margin-bottom: 8px;
}
.archive-month {
  font-family: 'Jost', sans-serif;
  font-size: 15px; font-weight: 300;
  letter-spacing: .06em;
  color: var(--t3);
  background: none; border: none; cursor: pointer;
  padding: 6px 0;
  transition: color .3s;
}
.archive-month:hover { color: var(--t1); }
.archive-month.active { color: var(--t1); font-weight: 500; }
.archive-all {
  font-family: 'Jost', sans-serif;
  font-size: 13px; font-weight: 400;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--t4);
  background: none; border: none; cursor: pointer;
  margin-top: 32px; padding: 8px 0;
  transition: color .3s;
}
.archive-all:hover { color: var(--t1); }
.archive-close {
  position: absolute; top: 24px; right: 40px;
  font-family: 'Jost', sans-serif;
  font-size: 13px; font-weight: 300;
  letter-spacing: .06em;
  color: #fff; background: none; border: none; cursor: pointer;
}

/* ══ EMPTY STATE ══ */
.diary-empty {
  text-align: center; padding: 200px 40px;
  color: var(--t4); font-size: 14px; letter-spacing: .04em;
}

@media (max-width: 600px) {
  nav { padding: 16px 20px; }
  .nav-title { font-size: 18px; }
  .nav-mid { display: none; }
  .nav-comma { margin: 0 6px; }
  .diary-date { left: 20px; font-size: 11px; }
  .archive-close { top: 16px; right: 20px; }
  body.zoom-2 .diary-feed, body.zoom-3 .diary-feed { max-width: 100%; }
}
</style>
</head>
<body class="zoom-1">

<nav>
  <div class="nav-left">
    <a href="/" class="nav-logo">Vieren</a>
    <span class="nav-title">Photo Diary</span>
  </div>
  <div class="nav-mid">
    <button class="zoom-btn" id="zoomIn">+</button>
    <span class="zoom-sep">/</span>
    <button class="zoom-btn" id="zoomOut">&minus;</button>
  </div>
  <div class="nav-right">
    <a href="/">portfolio</a>
    <span class="nav-comma">,</span>
    <button id="archiveToggle">archive</button>
    <span class="nav-comma">,</span>
    <a href="mailto:richard@vieren.studio">contact</a>
  </div>
</nav>

<!-- Archive overlay -->
<div class="archive-dropdown" id="archiveDropdown">
  <button class="archive-close" id="archiveClose">close</button>
  <div class="archive-inner" id="archiveInner"></div>
</div>

<div class="diary-date" id="diaryDate"></div>
<div class="diary-feed" id="diaryFeed"></div>

<script>
(function() {
  var feed = document.getElementById('diaryFeed');
  var dateEl = document.getElementById('diaryDate');
  var archiveToggle = document.getElementById('archiveToggle');
  var archiveDropdown = document.getElementById('archiveDropdown');
  var archiveClose = document.getElementById('archiveClose');
  var archiveInner = document.getElementById('archiveInner');
  var zoomInBtn = document.getElementById('zoomIn');
  var zoomOutBtn = document.getElementById('zoomOut');
  var allEntries = [];
  var currentZoom = 1;
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // Zoom: + makes bigger (lower number), - makes smaller (higher number)
  function setZoom(level) {
    document.body.classList.remove('zoom-' + currentZoom);
    currentZoom = Math.max(1, Math.min(3, level));
    document.body.classList.add('zoom-' + currentZoom);
  }
  zoomInBtn.addEventListener('click', function() { setZoom(currentZoom - 1); });
  zoomOutBtn.addEventListener('click', function() { setZoom(currentZoom + 1); });

  function formatDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function getYearMonth(dateStr) {
    var parts = dateStr.split('-');
    return { year: parts[0], month: parseInt(parts[1], 10) };
  }

  var entryObserver;
  function renderEntries(entries) {
    feed.innerHTML = '';
    if (entryObserver) entryObserver.disconnect();

    if (!entries.length) {
      feed.innerHTML = '<div class="diary-empty">Nothing here yet.</div>';
      return;
    }
    entries.forEach(function(entry) {
      var el = document.createElement('div');
      el.className = 'diary-entry';
      el.dataset.date = formatDate(entry.date);
      (entry.photos || []).forEach(function(p) {
        var img = document.createElement('img');
        img.src = 'image/diary/' + entry.date + '/' + p;
        img.alt = '';
        img.loading = 'lazy';
        el.appendChild(img);
      });
      feed.appendChild(el);
    });

    // Date observer
    entryObserver = new IntersectionObserver(function(obs) {
      obs.forEach(function(e) {
        if (e.isIntersecting) {
          dateEl.textContent = e.target.dataset.date;
        }
      });
    }, { rootMargin: '-50% 0px -50% 0px' });

    document.querySelectorAll('.diary-entry').forEach(function(el) {
      entryObserver.observe(el);
    });
  }

  // Archive
  function buildArchive() {
    var years = {};
    allEntries.forEach(function(entry) {
      var ym = getYearMonth(entry.date);
      if (!years[ym.year]) years[ym.year] = {};
      years[ym.year][ym.month] = true;
    });

    var html = '';
    Object.keys(years).sort().reverse().forEach(function(year) {
      html += '<div class="archive-year">' + year + '</div><div class="archive-months">';
      Object.keys(years[year]).map(Number).sort().reverse().forEach(function(m) {
        html += '<button class="archive-month" data-year="' + year + '" data-month="' + m + '">' + monthNames[m - 1] + '</button>';
      });
      html += '</div>';
    });
    html += '<button class="archive-all">show all</button>';
    archiveInner.innerHTML = html;

    archiveInner.querySelectorAll('.archive-month').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var y = btn.dataset.year;
        var m = parseInt(btn.dataset.month, 10);
        var filtered = allEntries.filter(function(entry) {
          var ym = getYearMonth(entry.date);
          return ym.year === y && ym.month === m;
        });
        renderEntries(filtered);
        closeArchive();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    archiveInner.querySelector('.archive-all').addEventListener('click', function() {
      renderEntries(allEntries);
      closeArchive();
    });
  }

  function openArchive() { archiveDropdown.classList.add('open'); }
  function closeArchive() { archiveDropdown.classList.remove('open'); }

  archiveToggle.addEventListener('click', function() {
    archiveDropdown.classList.contains('open') ? closeArchive() : openArchive();
  });
  archiveClose.addEventListener('click', closeArchive);
  archiveDropdown.addEventListener('click', function(e) {
    if (e.target === archiveDropdown) closeArchive();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeArchive();
  });

  // Load
  fetch('diary.json')
    .then(function(r) { return r.json(); })
    .then(function(entries) {
      allEntries = entries;
      renderEntries(entries);
      buildArchive();
    });
})();
</script>
</body>
</html>
