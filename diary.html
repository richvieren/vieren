<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Diary — Vieren</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Podium';
  src: url('fonts/podium-sharp.otf') format('opentype');
  font-weight: 900;
  font-display: swap;
}

:root {
  --bg: #0a0a0a;
  --t1: #EEE8D8;
  --t3: #9a9a8a;
  --t4: #6a6a5a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--t1);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

/* ══ NAV ══ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 99;
  padding: 24px 40px;
  display: flex; justify-content: space-between; align-items: center;
  mix-blend-mode: difference;
}
.nav-logo {
  font-family: 'Podium', sans-serif; font-weight: 900;
  font-size: 20px; color: #fff; letter-spacing: .02em; text-transform: uppercase;
}

/* ══ DIARY ENTRIES ══ */
.diary-feed {
  width: 100%;
}
.diary-entry {
  position: relative;
  width: 100%;
}
.diary-entry img {
  width: 100%;
  display: block;
}

/* Date overlay — fixed to left side while entry is in view */
.entry-overlay {
  position: sticky;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 40px;
  pointer-events: none;
}
.entry-date {
  font-family: 'Jost', sans-serif;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
}
.entry-location {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  letter-spacing: .06em;
  margin-top: 2px;
}
.entry-next {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  cursor: pointer;
  pointer-events: auto;
  transition: color .3s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.entry-next:hover {
  color: rgba(255,255,255,0.9);
}
.entry-next svg {
  width: 16px;
  height: 16px;
}

/* ══ EMPTY STATE ══ */
.diary-empty {
  text-align: center;
  padding: 200px 40px;
  color: var(--t4);
  font-size: 14px;
  letter-spacing: .04em;
}

@media (max-width: 600px) {
  nav { padding: 16px 20px; }
  .entry-overlay { padding: 16px 20px; }
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Vieren</a>
</nav>

<div class="diary-feed" id="diaryFeed"></div>

<script>
(function() {
  var feed = document.getElementById('diaryFeed');

  fetch('diary.json')
    .then(function(r) { return r.json(); })
    .then(function(entries) {
      if (!entries.length) {
        feed.innerHTML = '<div class="diary-empty">Nothing here yet.</div>';
        return;
      }
      entries.forEach(function(entry, idx) {
        feed.appendChild(createEntry(entry, idx, entries.length));
      });
    });

  function formatDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function createEntry(entry, idx, total) {
    var el = document.createElement('div');
    el.className = 'diary-entry';
    el.id = 'entry-' + idx;

    // Overlay with date + next arrow
    var overlay = document.createElement('div');
    overlay.className = 'entry-overlay';

    var left = '<div><div class="entry-date">' + formatDate(entry.date) + '</div>';
    if (entry.location) {
      left += '<div class="entry-location">' + entry.location + '</div>';
    }
    left += '</div>';

    var right = '';
    if (idx < total - 1) {
      right = '<div class="entry-next" onclick="document.getElementById(\'entry-' + (idx + 1) + '\').scrollIntoView({behavior:\'smooth\'})">Next <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>';
    }

    overlay.innerHTML = left + right;
    el.appendChild(overlay);

    // Photos — full bleed, stacked
    var photos = entry.photos || [];
    photos.forEach(function(p) {
      var img = document.createElement('img');
      img.src = 'image/diary/' + entry.date + '/' + p;
      img.alt = '';
      img.loading = 'lazy';
      el.appendChild(img);
    });

    return el;
  }
})();
</script>
</body>
</html>
