<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Diary — Vieren</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Podium';
  src: url('fonts/podium-sharp.otf') format('opentype');
  font-weight: 900;
  font-display: swap;
}
@font-face {
  font-family: 'Dharma Gothic';
  src: url('fonts/dharma-gothic-heavy.ttf') format('truetype');
  font-weight: 800;
  font-display: swap;
}

:root {
  --bg: #2C2E2C;
  --s1: #242624;
  --t1: #EEE8D8;
  --t2: #EEE8D8;
  --t3: #9a9a8a;
  --t4: #6a6a5a;
  --ac: #FF9F00;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--t2);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 99;
  padding: 24px 40px;
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg);
}
.nav-logo {
  font-family: 'Podium', sans-serif; font-weight: 900;
  font-size: 20px; color: var(--t1); letter-spacing: .02em; text-transform: uppercase;
}
.nav-cta {
  font-size: 11px; font-weight: 400; letter-spacing: .18em; text-transform: uppercase;
  color: var(--t1); border: 1px solid rgba(255,255,255,.3); padding: 10px 24px;
  transition: all .3s;
}
.nav-cta:hover { background: var(--t1); color: var(--bg); }

.diary-header {
  padding: 120px 40px 60px;
  max-width: 1000px;
  margin: 0 auto;
}
.diary-header h1 {
  font-family: 'Dharma Gothic', sans-serif;
  font-weight: 800;
  font-size: clamp(48px, 8vw, 96px);
  text-transform: uppercase;
  color: var(--t1);
  letter-spacing: .02em;
  line-height: 1;
}
.diary-header p {
  font-size: 14px;
  color: var(--t4);
  margin-top: 12px;
  letter-spacing: .04em;
}

/* ══ DIARY ENTRIES ══ */
.diary-feed {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 40px 120px;
}
.diary-entry {
  margin-bottom: 80px;
}
.diary-entry:last-child {
  margin-bottom: 0;
}

.entry-date {
  font-family: 'Jost', sans-serif;
  font-size: 13px;
  font-weight: 400;
  color: var(--t3);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.entry-location {
  font-size: 12px;
  color: var(--t4);
  margin-top: -12px;
  margin-bottom: 16px;
  letter-spacing: .06em;
}
.entry-tags {
  font-size: 11px;
  color: var(--t4);
  margin-top: -12px;
  margin-bottom: 16px;
  letter-spacing: .04em;
}
.entry-tags span {
  margin-right: 8px;
}

/* Photo grid — masonry-style, no cropping */
.entry-photos {
  columns: 2;
  column-gap: 4px;
}
.entry-photos.single {
  columns: 1;
}
.entry-photos img {
  width: 100%;
  display: block;
  margin-bottom: 4px;
}

/* ══ EMPTY STATE ══ */
.diary-empty {
  text-align: center;
  padding: 120px 40px;
  color: var(--t4);
  font-size: 14px;
  letter-spacing: .04em;
}

footer {
  padding: 32px 40px; border-top: 1px solid rgba(255,255,255,.06);
  display: flex; justify-content: space-between; align-items: center;
}
footer .fl { font-size: 13px; color: var(--t4); }
footer .fr { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--t4); }

@media (max-width: 600px) {
  nav { padding-left: 20px; padding-right: 20px; }
  .diary-header { padding: 100px 20px 40px; }
  .diary-feed { padding: 0 20px 80px; }
  .diary-entry { margin-bottom: 60px; }
  .entry-photos.multi-3 { grid-template-columns: 1fr 1fr; }
  footer { padding-left: 20px; padding-right: 20px; }
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Vieren</a>
  <a href="mailto:hello@vieren.studio" class="nav-cta">Get In Touch</a>
</nav>

<div class="diary-header">
  <h1>Photo Diary</h1>
  <p>A visual log.</p>
</div>

<div class="diary-feed" id="diaryFeed"></div>

<footer>
  <span class="fl">Vieren &copy; 2026</span>
  <span class="fr">Belgium &middot; South Africa</span>
</footer>

<script>
(function() {
  var feed = document.getElementById('diaryFeed');

  fetch('diary.json')
    .then(function(r) { return r.json(); })
    .then(function(entries) {
      if (!entries.length) {
        feed.innerHTML = '<div class="diary-empty">Nothing here yet.</div>';
        return;
      }
      entries.forEach(function(entry) {
        feed.appendChild(createEntry(entry));
      });
    });

  function formatDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function createEntry(entry) {
    var el = document.createElement('div');
    el.className = 'diary-entry';

    var html = '<div class="entry-date">' + formatDate(entry.date) + '</div>';
    if (entry.location) {
      html += '<div class="entry-location">' + entry.location + '</div>';
    }
    if (entry.tags && entry.tags.length) {
      html += '<div class="entry-tags">' + entry.tags.map(function(t) { return '<span>' + t + '</span>'; }).join('') + '</div>';
    }

    var photos = entry.photos || [];
    var gridClass = photos.length === 1 ? 'single' : '';

    html += '<div class="entry-photos ' + gridClass + '">';
    photos.forEach(function(p) {
      html += '<img src="image/diary/' + entry.date + '/' + p + '" alt="" loading="lazy">';
    });
    html += '</div>';

    el.innerHTML = html;
    return el;
  }
})();
</script>
</body>
</html>
