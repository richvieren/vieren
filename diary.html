<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Diary — Vieren</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Podium';
  src: url('fonts/podium-sharp.otf') format('opentype');
  font-weight: 900;
  font-display: swap;
}

:root {
  --bg: #0a0a0a;
  --t1: #EEE8D8;
  --t4: #6a6a5a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--t1);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

/* ══ NAV ══ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 99;
  padding: 24px 40px;
  display: flex; justify-content: space-between; align-items: center;
  mix-blend-mode: difference;
}
.nav-logo {
  font-family: 'Podium', sans-serif; font-weight: 900;
  font-size: 20px; color: #fff; letter-spacing: .02em; text-transform: uppercase;
}

/* ══ FIXED DATE ══ */
.diary-date {
  position: fixed;
  top: 50%;
  left: 40px;
  transform: translateY(-50%);
  z-index: 50;
  font-family: 'Podium', sans-serif;
  font-weight: 900;
  font-size: 14px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.75);
  text-shadow: 0 1px 12px rgba(0,0,0,0.6);
  mix-blend-mode: difference;
  pointer-events: none;
}

/* ══ DIARY ENTRIES ══ */
.diary-feed {
  width: 100%;
}
.diary-entry {
  position: relative;
  width: 100%;
}
.diary-entry img {
  width: 100%;
  display: block;
}

/* ══ EMPTY STATE ══ */
.diary-empty {
  text-align: center;
  padding: 200px 40px;
  color: var(--t4);
  font-size: 14px;
  letter-spacing: .04em;
}

@media (max-width: 600px) {
  nav { padding: 16px 20px; }
  .diary-date { left: 20px; font-size: 12px; }
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Vieren</a>
</nav>

<div class="diary-date" id="diaryDate"></div>
<div class="diary-feed" id="diaryFeed"></div>

<script>
(function() {
  var feed = document.getElementById('diaryFeed');
  var dateEl = document.getElementById('diaryDate');

  function formatDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  fetch('diary.json')
    .then(function(r) { return r.json(); })
    .then(function(entries) {
      if (!entries.length) {
        feed.innerHTML = '<div class="diary-empty">Nothing here yet.</div>';
        return;
      }

      // Build entries
      entries.forEach(function(entry) {
        var el = document.createElement('div');
        el.className = 'diary-entry';
        el.dataset.date = formatDate(entry.date);

        var photos = entry.photos || [];
        photos.forEach(function(p) {
          var img = document.createElement('img');
          img.src = 'image/diary/' + entry.date + '/' + p;
          img.alt = '';
          img.loading = 'lazy';
          el.appendChild(img);
        });

        feed.appendChild(el);
      });

      // Set initial date
      dateEl.textContent = entries[0] ? formatDate(entries[0].date) : '';

      // Observe entries to swap date
      var observer = new IntersectionObserver(function(obs) {
        obs.forEach(function(e) {
          if (e.isIntersecting) {
            dateEl.textContent = e.target.dataset.date;
          }
        });
      }, { rootMargin: '-50% 0px -50% 0px' });

      document.querySelectorAll('.diary-entry').forEach(function(el) {
        observer.observe(el);
      });
    });
})();
</script>
</body>
</html>
