<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Portfolio — Vieren</title>
<meta name="description" content="Photography portfolio by Vieren.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.css">
<style>
@font-face {
  font-family: 'Podium';
  src: url('fonts/podium-sharp.otf') format('opentype');
  font-weight: 900;
  font-display: swap;
}
@font-face {
  font-family: 'Instrument Serif';
  src: url('fonts/InstrumentSerif-Italic.ttf') format('truetype');
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: 'Dharma Gothic';
  src: url('fonts/dharma-gothic-heavy.ttf') format('truetype');
  font-weight: 800;
  font-display: swap;
}

:root {
  --bg: #eae7df;
  --t1: #1c1512;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--t1);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

/* ══ NAV ══ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 99;
  padding: 20px 40px;
  display: flex; align-items: center; justify-content: space-between;
  mix-blend-mode: difference;
}
.nav-left { display: flex; align-items: baseline; gap: 12px; }
.nav-logo {
  font-family: 'Podium', sans-serif; font-weight: 900;
  font-size: 20px; color: #fff; letter-spacing: .02em; text-transform: uppercase;
}
.nav-right { display: flex; align-items: center; }
.nav-right a {
  font-family: 'Jost', sans-serif;
  font-size: 13px; font-weight: 300; letter-spacing: .06em;
  color: #fff; transition: opacity .3s;
}
.nav-right a:hover { opacity: 0.5; }
.nav-comma { font-size: 13px; color: rgba(255,255,255,0.4); margin: 0 8px; }

/* ══ SPLIT: fixed intro left, photo stream right (after mainlyphotography.com/projects/un-ordinary) ══ */
.pf-intro {
  position: fixed; top: 0; left: 0; bottom: 0; width: 40vw;
  padding: 0 40px;
  display: flex; flex-direction: column; justify-content: center;
}
.pf-title {
  font-family: 'Dharma Gothic', sans-serif; font-weight: 800;
  font-size: clamp(72px, 9vw, 140px); line-height: .88;
  text-transform: uppercase; letter-spacing: .01em;
}
.pf-tagline {
  font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: clamp(16px, 1.3vw, 19px); line-height: 1.4;
  color: rgba(28,21,18,0.7); max-width: 22em; margin-top: 28px;
}
.pf-contact {
  align-self: flex-start; margin-top: 28px;
  font-size: 11px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase;
  border-bottom: 1px solid rgba(28,21,18,.35); padding-bottom: 3px; transition: opacity .3s;
}
.pf-contact:hover { opacity: .5; }

/* Photos stack edge to edge on the right; widths vary so the left edges stagger */
.pf-stream { margin-left: 45vw; display: flex; flex-direction: column; align-items: flex-end; }
.pf-stream img { display: block; height: auto; width: 50vw; }
/* Width follows the photo's place in its set (w1-w4), so every loop copy has the same heights */
.pf-stream img.w1 { width: 36vw; }
.pf-stream img.w2 { width: 45vw; }
.pf-stream img.w3 { width: 41vw; }
.pf-stream img.w4 { width: 55vw; }

/* Desktop: the page stays still and the photo column loops without end, like the reference */
@media (min-width: 701px) {
  html, body { height: 100%; overflow: hidden; }
  .pf-stream { position: fixed; top: 0; right: 0; width: 55vw; margin-left: 0; will-change: transform; }
}

@media (max-width: 700px) {
  nav { padding: 16px 20px; }
  .pf-intro { position: static; width: auto; padding: 100px 20px 40px; }
  .pf-stream { margin-left: 0; }
  .pf-stream img, .pf-stream img:nth-child(n) { width: 100%; }
  .pf-stream .pf-clone { display: none; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="/" class="nav-logo">Vieren</a>
  </div>
  <div class="nav-right">
    <a href="/">portfolio</a>
    <span class="nav-comma">,</span>
    <a href="mailto:richard@vieren.studio">contact</a>
  </div>
</nav>

<header class="pf-intro">
  <h1 class="pf-title">Photo<br>Portfolio.</h1>
  <p class="pf-tagline">A selection of my best photos. I will be in Cape Town over the next few months and I'm opening a few slots per month if you want to shoot!</p>
  <a class="pf-contact" href="mailto:richard@vieren.studio">richard@vieren.studio</a>
</header>

<main class="pf-stream" id="pfStream"></main>

<script>
// Every diary photo tagged "portfolio", newest first, then the older work listed in portfolio.json (image/portfolio/)
var desktop = matchMedia('(min-width: 701px)');
var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function() {
  var grid = document.getElementById('pfStream');
  var srcs = [];
  Promise.all([
    fetch('diary.json').then(function(r) { return r.json(); }),
    fetch('portfolio.json').then(function(r) { return r.json(); }).catch(function() { return []; })
  ]).then(function(res) {
    var entries = res[0];
    entries.sort(function(a, b) { return b.date.localeCompare(a.date); });
    entries.forEach(function(e) {
      var entryTagged = (e.tags || []).indexOf('portfolio') !== -1;
      (e.photos || []).forEach(function(p) {
        var file = typeof p === 'object' ? p.file : p;
        var tagged = entryTagged || (typeof p === 'object' && (p.tags || []).indexOf('portfolio') !== -1);
        if (tagged) srcs.push('image/diary/' + e.date + '/' + file);
      });
    });
    res[1].forEach(function(file) { srcs.push('image/portfolio/' + file); });
    // Three copies: the loop always has photos above and below the screen. Copies 2 and 3 hide on phones
    for (var copy = 0; copy < 3; copy++) {
      srcs.forEach(function(src, i) {
        var img = document.createElement('img');
        img.src = src;
        img.alt = '';
        img.className = 'w' + (i % 5);
        if (copy) { img.classList.add('pf-clone'); img.setAttribute('aria-hidden', 'true'); }
        else if (!desktop.matches) img.loading = 'lazy';
        grid.appendChild(img);
      });
    }
    loop(grid, srcs.length);
  });
})();

// Wheel, keys and touch move the column; it eases toward the target and wraps after one full set of photos
function loop(grid, n) {
  if (!n) return;
  var target = 0, current = 0, setH = 0, touchY = null;
  function measure() { setH = grid.children[n].offsetTop - grid.children[0].offsetTop; }
  grid.addEventListener('load', measure, true);
  addEventListener('resize', measure);
  measure();
  addEventListener('wheel', function(e) {
    if (!desktop.matches) return;
    e.preventDefault();
    target += e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
  }, { passive: false });
  addEventListener('keydown', function(e) {
    if (!desktop.matches) return;
    var step = { ArrowDown: 120, ArrowUp: -120, PageDown: innerHeight * .9, PageUp: -innerHeight * .9, ' ': innerHeight * .9 }[e.key];
    if (step) { e.preventDefault(); target += step; }
  });
  addEventListener('touchstart', function(e) { touchY = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchmove', function(e) {
    if (!desktop.matches || touchY === null) return;
    e.preventDefault();
    target += (touchY - e.touches[0].clientY) * 1.5;
    touchY = e.touches[0].clientY;
  }, { passive: false });
  function raf() {
    if (desktop.matches && setH > 0) {
      current = reduced ? target : current + (target - current) * .08;
      // Wrap into the middle copy so photos sit above and below the viewport in both directions
      var y = ((current % setH) + setH) % setH + setH;
      grid.style.transform = 'translate3d(0,' + (-y).toFixed(2) + 'px,0)';
    } else {
      grid.style.transform = '';
    }
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);
}
</script>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
// Eased page scroll on phones only (desktop runs the photo loop); off when the visitor asks for reduced motion
(function() {
  if (!window.Lenis || reduced || desktop.matches) return;
  var lenis = new Lenis();
  function raf(t) { lenis.raf(t); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
})();
</script>

</body>
</html>
